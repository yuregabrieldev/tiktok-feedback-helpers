name: Build Video Harvester v2.9.1

on:
  push:
    branches: [ video-harvester-android ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: video-harvester-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp video-harvester-android/app/build/outputs/apk/debug/app-debug.apk Video-Harvester-v2.9.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Harvester-v2.9.1
          path: Video-Harvester-v2.9.1.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: video-harvester-v2.9.1
          target_commitish: ${{ github.sha }}
          name: Video Harvester v2.9.1
          body: >-
            PT-BR title hints and explicit send-to-Vista action for tested direct media; iframe references and signed temporary URLs remain isolated.
          files: Video-Harvester-v2.9.1.apk
