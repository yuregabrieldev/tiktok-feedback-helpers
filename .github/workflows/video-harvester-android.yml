name: Build Video Harvester v2.5

on:
  push:
    branches: [ video-harvester-android ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: video-harvester-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp video-harvester-android/app/build/outputs/apk/debug/app-debug.apk Video-Harvester-v2.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Harvester-v2.5
          path: Video-Harvester-v2.5.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: video-harvester-v2.5
          name: Video Harvester v2.5
          body: Playback test buttons in Videos and Library: open original iframe in WebView or test direct media in Android player, and save separate playback statuses. No ad or access-gate automation.
          files: Video-Harvester-v2.5.apk
