name: Build and Release Video Harvester Android APK

on:
  push:
    branches: [ video-harvester-android ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: video-harvester-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          cp video-harvester-android/app/build/outputs/apk/debug/app-debug.apk Video-Harvester-v1.0.apk
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Harvester-APK
          path: Video-Harvester-v1.0.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete video-harvester-v1.0 --yes --cleanup-tag || true
          gh release create video-harvester-v1.0 Video-Harvester-v1.0.apk --target "${GITHUB_SHA}" --title "Video Harvester v1.0" --notes "APK Android do Video Harvester. Instalação direta no Android."
