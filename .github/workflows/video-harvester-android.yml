name: Build Simples Scraper v3.0.1

on:
  push:
    branches: [ video-harvester-android ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: video-harvester-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp video-harvester-android/app/build/outputs/apk/debug/app-debug.apk Simples-Scraper-v3.0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Simples-Scraper-v3.0.1
          path: Simples-Scraper-v3.0.1.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: simples-scraper-v3.0.1
          target_commitish: ${{ github.sha }}
          name: Simples Scraper v3.0.1
          body: >-
            Simples Scraper (formerly Video Harvester), version 3.0.1. Independent website and video scraper, with experimental optional BR catalog and handoff to VS. This APK is NOT Harvester Browser; that is a separate Android project and release line.
          files: Simples-Scraper-v3.0.1.apk
