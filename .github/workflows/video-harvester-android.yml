name: Build Video Harvester v1.3

on:
  push:
    branches: [ video-harvester-android ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: video-harvester-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp video-harvester-android/app/build/outputs/apk/debug/app-debug.apk Video-Harvester-v1.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Harvester-v1.3
          path: Video-Harvester-v1.3.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: video-harvester-v1.3
          name: Video Harvester v1.3
          body: WebView and VPN compatibility improvements, shared cookies, default Android WebView user agent, HTTP diagnostics, and sitemap fallback while keeping separate site and iframe crawlers.
          files: Video-Harvester-v1.3.apk
