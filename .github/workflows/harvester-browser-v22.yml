name: Harvester Browser v2.2 — Page Lock
on:
  push:
    branches: [harvester-browser-v22-page-lock]
    paths:
      - harvester-browser/v2.2.0/**
      - .github/workflows/harvester-browser-v22.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore verified Harvester Browser v1.4 base
        run: |
          mkdir -p hb-v18
          cat harvester-browser/v1.4.0/payload*.txt | base64 --decode > /tmp/hb-v14.txz
          echo "2676ef48fb053bf276281e08745f29e7c184658cd2edfa0bb2a084c7379af2a2  /tmp/hb-v14.txz" | sha256sum -c -
          tar -xJf /tmp/hb-v14.txz -C hb-v18
      - name: Apply verified Cast integration v1.5
        run: |
          echo "97e43ab4f90eb24f24afb373677f070b78c4cfe741ad79bdf50e0b1f232fb235  harvester-browser/v1.5.0/cast-patch.xz.b64" | sha256sum -c -
          base64 -d harvester-browser/v1.5.0/cast-patch.xz.b64 | xz -d >/tmp/cast-v15.py
          (cd hb-v18 && python3 /tmp/cast-v15.py)
      - name: Apply v1.6 and v1.7 improvements
        run: |
          (cd hb-v18 && python3 ../harvester-browser/v1.6.0/fix-cast.py)
          (cd hb-v18 && python3 ../harvester-browser/v1.7.0/now-playing-cast.py)
      - name: Integrate local video playback and cast
        run: |
          (cd hb-v18 && python3 ../harvester-browser/v1.8.0/install-player.py)
          grep -q "versionName '1.8.0'" hb-v18/app/build.gradle
          grep -q 'class NativePlayerActivity' hb-v18/app/src/main/java/com/harvester/browser/NativePlayerActivity.java
      - name: Install safe player and receiver-state Cast diagnostics
        run: |
          (cd hb-v18 && python3 ../harvester-browser/v1.9.0/upgrade.py)
          grep -q "versionName '1.9.0'" hb-v18/app/build.gradle
          grep -q 'Reprodutor e Google Cast' hb-v18/app/src/main/java/com/harvester/browser/MainActivity.java
          grep -q 'class NativePlayerActivity' hb-v18/app/src/main/java/com/harvester/browser/NativePlayerActivity.java
      - name: Restore actual VistaCast source
        run: |
          mkdir -p vista
          base64 -d harvester-browser/v2.0.0/vistacast-base.tar.xz.b64 | xz -d | tar -xf - -C vista
          test -f vista/app/src/main/java/com/vistacast/app/PlaybackService.java
          test -f vista/app/src/main/java/com/vistacast/app/MainActivity.java
      - name: Replace Harvester player with VistaCast CastPlayer implementation
        run: |
          python3 harvester-browser/v2.0.0/integrate-vistacast.py
          grep -q "versionName '2.0.0'" hb-v18/app/build.gradle
          grep -q 'MediaRouteButtonFactory' hb-v18/app/src/main/java/com/harvester/browser/NativePlayerActivity.java
          grep -q 'CastPlayer.Builder' hb-v18/app/src/main/java/com/harvester/browser/PlaybackService.java
      - name: Apply browser and VistaCast reliability upgrades
        run: |
          python3 harvester-browser/v2.1.0/upgrade-browser.py
          python3 harvester-browser/v2.1.0/upgrade-player.py
          grep -q "versionName '2.1.0'" hb-v18/app/build.gradle
          grep -q 'auto_open_player_on_play' hb-v18/app/src/main/java/com/harvester/browser/MainActivity.java
          grep -q 'showQualitySelection' hb-v18/app/src/main/java/com/harvester/browser/NativePlayerActivity.java
          grep -q 'Reproduzir no telemóvel' hb-v18/app/src/main/java/com/harvester/browser/NativePlayerActivity.java
      - name: Apply per-tab navigation lock
        run: |
          python3 harvester-browser/v2.2.0/apply-page-lock.py
          grep -q "versionName '2.2.0'" hb-v18/app/build.gradle
          grep -q 'Bloquear saída da página atual' hb-v18/app/src/main/java/com/harvester/browser/MainActivity.java
          test -s hb-v18/app/src/main/assets/pagelock.js
      - name: Verify page pin URL decisions
        working-directory: hb-v18
        run: |
          mkdir -p /tmp/hb22-tests
          javac -d /tmp/hb22-tests app/src/main/java/com/harvester/browser/core/PageNavigationLock.java core-tests/PageNavigationLockTests.java
          java -cp /tmp/hb22-tests PageNavigationLockTests
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test extraction engine and Cast eligibility
        working-directory: hb-v18
        run: |
          mkdir -p /tmp/hb18-tests
          javac -d /tmp/hb18-tests app/src/main/java/com/harvester/browser/core/*.java core-tests/CoreTests.java
          java -cp /tmp/hb18-tests CoreTests
      - name: Compile Android APK
        working-directory: hb-v18
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Stage and verify APK
        run: |
          test -s hb-v18/app/build/outputs/apk/debug/app-debug.apk
          cp hb-v18/app/build/outputs/apk/debug/app-debug.apk Harvester-Browser-v2.2.0-Page-Lock.apk
          sha256sum Harvester-Browser-v2.2.0-Page-Lock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Harvester-Browser-v2.2.0-Page-Lock
          path: Harvester-Browser-v2.2.0-Page-Lock.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: harvester-browser-v2.2.0
          name: Harvester Browser v2.2.0 — Per-tab navigation lock
          body: |
            Adds an independent, opt-in "Bloquear saída da página atual" switch,
            pinning only the current tab to its exact page URL (hash anchors allowed).
            Top-level redirects, anchor links, form submissions and SPA history
            navigation are blocked, while video, iframe and network resource loading
            remain available. Disabling the toggle restores normal browsing.
            Based on v2.1 with VistaCast player; physical device testing is pending.
          files: Harvester-Browser-v2.2.0-Page-Lock.apk
