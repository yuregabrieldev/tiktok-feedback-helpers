        with:
          name: VistaBrowser-v4.0.0
          path: VistaBrowser-v4.0.0.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vistabrowser-v4.0.0
          target_commitish: ${{ github.sha }}
          name: VistaBrowser v4.0.0 — Complete Light / Dark Theme
          body: |
            VistaBrowser v4.0.0 — complete native light/dark theme system.
            Fixes the issue where switching to Claro only affected small top
            and bottom areas, while menus, cards, tabs and settings stayed dark.
            Introduces shared runtime palette for dark and ivory light themes,
            contrast-aware labels, icons, selected borders and toggles.
            Appearance and Página inicial settings, internal diagnostics,
            library, search, browser chrome and Opera-inspired tab overview
            now use the selected native theme.
            On the floral homepage, light mode softly washes the wallpaper
            with ivory, uses dark readable controls and translucent light cards.
            Android status and navigation icon contrast follows theme.
            Respects Seguir sistema, Claro and Escuro. Web content is not
            forcibly altered: site CSS remains independent.
            All scanner, crawler, Cast, player and VistaStream Intent
            integration functions are preserved.
            Debug APK signing must match previous versions for direct update.
          files: VistaBrowser-v4.0.0.apk
