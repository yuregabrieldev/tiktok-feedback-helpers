      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test extraction engine and Cast eligibility
        working-directory: hb-v18
        run: |
          mkdir -p /tmp/hb18-tests
          javac -d /tmp/hb18-tests app/src/main/java/com/harvester/browser/core/*.java core-tests/CoreTests.java
          java -cp /tmp/hb18-tests CoreTests
      - name: Compile Android APK
        working-directory: hb-v18
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Stage APK
        run: |
          test -s hb-v18/app/build/outputs/apk/debug/app-debug.apk
          cp hb-v18/app/build/outputs/apk/debug/app-debug.apk VistaBrowser-v4.0.0.apk
          sha256sum VistaBrowser-v4.0.0.apk
