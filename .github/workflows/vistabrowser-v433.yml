      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vistabrowser-v4.3.3
          target_commitish: ${{ github.sha }}
          name: VistaBrowser v4.3.3 — Capture to VistaStream Catalog
          body: |
            VistaBrowser v4.3.3 — Captura de vídeo ligada ao catálogo VistaStream.
            No inspetor de vídeo, Capturar vídeo identifica um URL HTML5 já
            disponibilizado pelo player, mostra título/temporada/episódio,
            idioma, áudio, qualidade e a origem, e abre o editor de metadados
            do VistaStream. O VistaStream v0.15.4+ procura o título no mesmo
            catálogo Cinemeta/AniList usado na aplicação; o utilizador
            seleciona o título e episódio corretos e confirma a fonte.
            O inspetor só conclui a captura após confirmação de gravação,
            distinguindo referências Web de vídeos reproduzíveis; caso seja
            cancelado, mantém o player aberto. Links de sessão HLS podem
            expirar e não são guardados como ficheiros offline.
            Todas as ferramentas anteriores de análise DOM, iframe,
            inspeção, biblioteca e Chromecast permanecem disponíveis.
            As pistas de metadados são heurísticas; não há modelo LLM autónomo
            a reconhecer o conteúdo por visão.
            A versão VistaStream v0.15.4 (ou superior com compatibilidade)
            é necessária para associação ao catálogo.
          files: VistaBrowser-v4.3.3.apk
