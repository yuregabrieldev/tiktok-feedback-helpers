name: Build Harvester Browser Android
on:
  push:
    branches: [harvester-browser-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Android source
        run: |
          mkdir -p browser-app
          cat browser-build/payload*.txt | base64 -d > /tmp/harvester-browser.txz
          echo "16c4c729912997bdfe5ce85adb2d8acb00a311146f49951993d950c9b500b1fb  /tmp/harvester-browser.txz" | sha256sum -c -
          tar -xJf /tmp/harvester-browser.txz -C browser-app
          test -f browser-app/app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test core
        working-directory: browser-app
        run: |
          mkdir -p /tmp/hb-tests
          javac -d /tmp/hb-tests app/src/main/java/com/harvester/browser/core/*.java core-tests/CoreTests.java
          java -cp /tmp/hb-tests CoreTests
      - name: Compile Android APK
        working-directory: browser-app
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK and copy
        run: |
          test -s browser-app/app/build/outputs/apk/debug/app-debug.apk
          cp browser-app/app/build/outputs/apk/debug/app-debug.apk Harvester-Browser-v1.0.0.apk
          sha256sum Harvester-Browser-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Harvester-Browser-v1.0.0-APK
          path: Harvester-Browser-v1.0.0.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: harvester-browser-v1.0.0
          name: Harvester Browser v1.0.0 (debug)
          body: "Android debug build of Harvester Browser. Safari-inspired interface, HTML/CSS/JS inspection, video detection, media library and domain crawler. Not independently tested on a physical Android device."
          files: Harvester-Browser-v1.0.0.apk
