name: Build Harvester Browser v1.1.0
on:
  push:
    branches:
      - harvester-browser-android
    paths:
      - harvester-browser/**
      - .github/workflows/harvester-browser-android.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unpack complete Android source
        run: |
          base64 -d harvester-browser/source-v1.1.0.tar.xz.b64 > /tmp/harvester-browser-source.tar.xz
          tar -xJf /tmp/harvester-browser-source.tar.xz
          test -f HarvesterBrowser/app/build.gradle
      - name: Test media scanner and crawler safety
        working-directory: HarvesterBrowser
        run: |
          mkdir -p /tmp/harvester-tests
          javac -d /tmp/harvester-tests app/src/main/java/com/harvester/browser/core/*.java core-tests/CoreTests.java
          java -cp /tmp/harvester-tests CoreTests
      - name: Compile Android APK
        working-directory: HarvesterBrowser
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp HarvesterBrowser/app/build/outputs/apk/debug/app-debug.apk Harvester-Browser-v1.1.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harvester-Browser-v1.1.0
          path: Harvester-Browser-v1.1.0.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: harvester-browser-v1.1.0
          name: Harvester Browser v1.1.0
          body: |
            Browser update: Chrome-style grouped menu, Safari-inspired translucency,
            search at top, keyboard resize/dismiss handling, optional popup blocking,
            separated observed/reference media URLs, HTTPS source check, and metadata when available.
            Debug signed APK for Android 8.0+.
          files: Harvester-Browser-v1.1.0.apk
