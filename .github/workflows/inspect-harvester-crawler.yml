name: Inspect Harvester crawler limits
on:
  push:
    branches: [harvester-browser-v23-safe-traffic]
    paths: [.github/workflows/inspect-harvester-crawler.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect crawler code without contacting external websites
        run: |
          mkdir -p hb
          cat harvester-browser/v1.4.0/payload*.txt | base64 -d | tar -xJf - -C hb
          find hb -type f -name '*.java' | sort | grep -Ei 'crawler|network|scanner|mainactivity'
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('hb').rglob('*.java'):
              t=p.read_text(errors='replace')
              if p.name!='MainActivity.java':continue
              lines=t.splitlines()
              wanted=[i for i,line in enumerate(lines) if
                      any(term in line for term in ('crawl(', 'crawl=', 'Crawler', 'crawlLimit',
                      'crawlPage', 'crawlQueue', 'crawlTask', 'URLConnection', 'OkHttp',
                      'openConnection(', 'Thread.sleep', 'fetchUrl(', 'crawlUrl(',
                      'startCrawl(', 'crawlWorker(', 'requestCount'))]
              print("KEYLINES",wanted)
              for i in wanted:
                  print('--------',i+1,'--------')
                  for k in range(max(0,i-3),min(len(lines),i+12)):
                      print(f'{k+1}: {lines[k]}')
          PY
