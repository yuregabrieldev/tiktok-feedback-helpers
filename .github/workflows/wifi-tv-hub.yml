name: WiFi TV Hub APK
on:
  push:
    branches: [wifi-tv-hub-android]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          echo "SDK at $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename output
        run: cp app/build/outputs/apk/debug/app-debug.apk WiFiTVHub-Universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WiFiTVHub-Universal-APK
          path: WiFiTVHub-Universal.apk
          retention-days: 30
