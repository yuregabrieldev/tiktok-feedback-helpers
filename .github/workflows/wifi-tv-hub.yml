name: WiFi TV Hub APK
on:
  push:
    branches: [wifi-tv-hub-android]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          echo "SDK at $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename output
        run: cp app/build/outputs/apk/debug/app-debug.apk WiFiTVHub-Universal-v1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WiFiTVHub-Universal-APK
          path: WiFiTVHub-Universal-v1.1.0.apk
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="wifi-tv-hub-v1.1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" WiFiTVHub-Universal-v1.1.0.apk --clobber
          else
            gh release create "$TAG" WiFiTVHub-Universal-v1.1.0.apk --title "WiFi TV Hub v1.1.0" --notes "v1.1.0: descoberta automática do aplicativo na TV via mDNS, reconhecimento de Google Cast, lista Bluetooth pareada, modo TV manual. APK debug ainda sem testes em aparelhos físicos. Para atualização, pode ser necessário remover v1.0 devido à assinatura de debug." --target "$GITHUB_SHA"
          fi
