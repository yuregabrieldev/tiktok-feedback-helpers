name: VistaController Android beta release
on:
  push:
    branches:
      - 'vistacontroller-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble verified source archive
        shell: bash
        run: |
          cat VistaController-source.part0{0..5} | base64 --decode > VistaController-src.tar.xz
          tar -xJf VistaController-src.tar.xz
          test -f VistaController/settings.gradle.kts
          cat VistaController-v0.2.0-patch.part0{0..8} | base64 --decode > VistaController-v0.2.0-patch.tar.xz
          tar -xJf VistaController-v0.2.0-patch.tar.xz
          test -f VistaController/mobile/src/main/java/dev/vista/controller/WifiRemoteClient.kt
          cat VistaController-v0.2.1-ui.part0{0..4} | base64 --decode > VistaController-v0.2.1-ui.tar.xz
          echo '322c32cec264a3a746c48a39f2a7dee37983becd23edf61cff2aea3099747515  VistaController-v0.2.1-ui.tar.xz' | sha256sum -c -
          tar -xJf VistaController-v0.2.1-ui.tar.xz
          cat VistaController-v0.2.2-safe.part0{0..3} | base64 --decode > VistaController-v0.2.2-safe-patch.tar.xz
          echo 'a30959847866ed782fa614a4a4528d15c487acae84c21f58bb177767c3c9e972  VistaController-v0.2.2-safe-patch.tar.xz' | sha256sum -c -
          tar -xJf VistaController-v0.2.2-safe-patch.tar.xz
          cat VistaController-v0.2.3-discovery.part0{0..1} | base64 --decode > VistaController-v0.2.3-discovery.patch.xz
          echo 'edc635c33527ec48b88c44096d0eb21e2bd84b81e24f5236a485004d06033801  VistaController-v0.2.3-discovery.patch.xz' | sha256sum -c -
          xz --decompress --stdout VistaController-v0.2.3-discovery.patch.xz > VistaController-v0.2.3-discovery.patch
          patch --batch --forward -p1 < VistaController-v0.2.3-discovery.patch
          test -f VistaController/mobile/src/main/java/dev/vista/controller/TvDiscovery.kt
          rm -f VistaController/tvbridge/src/main/java/dev/vista/tvbridge/TvAccessService.kt VistaController/tvbridge/src/main/res/xml/accessibility_config.xml
          ! grep -q 'BIND_ACCESSIBILITY_SERVICE' VistaController/tvbridge/src/main/AndroidManifest.xml
          ! grep -q 'TvAccessService' VistaController/tvbridge/src/main/AndroidManifest.xml
          grep -q 'versionName = "0.2.3"' VistaController/mobile/build.gradle.kts
          # BouncyCastle jars include duplicate Java 9 OSGi metadata, irrelevant on Android.
          sed -i 's@packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }@packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"; resources.excludes += "META-INF/versions/**" }@' VistaController/mobile/build.gradle.kts
          # Connected-device typed startForeground is an Android 14+ API.
          sed -i 's/Build.VERSION.SDK_INT >= 29) startForeground/Build.VERSION.SDK_INT >= 34) startForeground/g' \
            VistaController/mobile/src/main/java/dev/vista/controller/ConnectionService.kt \
            VistaController/tvbridge/src/main/java/dev/vista/tvbridge/TvBridgeService.kt
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile mobile and TV APKs
        working-directory: VistaController
        run: gradle --no-daemon --stacktrace :mobile:assembleDebug
      - name: Prepare release assets
        run: |
          cp VistaController/mobile/build/outputs/apk/debug/mobile-debug.apk VistaController-Mobile-v0.2.3.apk
          sha256sum VistaController-Mobile-v0.2.3.apk > SHA256SUMS.txt
      - name: Upload compiled mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: VistaController-v0.2.3-Mobile
          path: |
            VistaController-Mobile-v0.2.3.apk
            SHA256SUMS.txt
      - name: Publish Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vistacontroller-v0.2.3 \
            VistaController-Mobile-v0.2.3.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'VistaController v0.2.3 · Descoberta automática por Wi-Fi' --prerelease \
            --notes 'Agora procura Android TVs automaticamente por DNS-SD/mDNS (_androidtvremote2._tcp.), apresenta nome e IP para seleção, inicia emparelhamento pelo código da TV e tenta reconectar ao último IP guardado. Inclui MulticastLock limitado à pesquisa em primeiro plano e mantém ligação manual como alternativa. Apenas o app Mobile mudou. Para a TV, usa TV Bridge v0.2.2 já publicado: https://github.com/yuregabrieldev/tiktok-feedback-helpers/releases/tag/vistacontroller-v0.2.2 . APK beta assinado com chave debug temporária; uma instalação anterior pode exigir desinstalação do app no telemóvel. A compatibilidade e descoberta real na Hisense ainda requerem teste físico. Não é necessário desativar o Play Protect.'
