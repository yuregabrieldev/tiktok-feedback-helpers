name: VistaController Android beta release
on:
  push:
    branches:
      - 'vistacontroller-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble verified source archive
        shell: bash
        run: |
          cat VistaController-source.part0{0..5} | base64 --decode > VistaController-src.tar.xz
          tar -xJf VistaController-src.tar.xz
          test -f VistaController/settings.gradle.kts
          cat VistaController-v0.2.0-patch.part0{0..8} | base64 --decode > VistaController-v0.2.0-patch.tar.xz
          tar -xJf VistaController-v0.2.0-patch.tar.xz
          test -f VistaController/mobile/src/main/java/dev/vista/controller/WifiRemoteClient.kt
          cat VistaController-v0.2.1-ui.part0{0..4} | base64 --decode > VistaController-v0.2.1-ui.tar.xz
          echo '322c32cec264a3a746c48a39f2a7dee37983becd23edf61cff2aea3099747515  VistaController-v0.2.1-ui.tar.xz' | sha256sum -c -
          tar -xJf VistaController-v0.2.1-ui.tar.xz
          grep -q 'versionName = "0.2.1"' VistaController/mobile/build.gradle.kts
          # Material3 ModalBottomSheet uses an experimental API in the pinned Compose version.
          sed -i '/@Composable private fun RemotePage(/i @OptIn(ExperimentalMaterial3Api::class)' VistaController/mobile/src/main/java/dev/vista/controller/MainActivity.kt
          # BouncyCastle jars include duplicate Java 9 OSGi metadata, irrelevant on Android.
          sed -i 's@packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }@packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"; resources.excludes += "META-INF/versions/**" }@' VistaController/mobile/build.gradle.kts
          # Connected-device typed startForeground is an Android 14+ API.
          sed -i 's/Build.VERSION.SDK_INT >= 29) startForeground/Build.VERSION.SDK_INT >= 34) startForeground/g' \
            VistaController/mobile/src/main/java/dev/vista/controller/ConnectionService.kt \
            VistaController/tvbridge/src/main/java/dev/vista/tvbridge/TvBridgeService.kt
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile mobile and TV APKs
        working-directory: VistaController
        run: gradle --no-daemon --stacktrace :mobile:assembleDebug :tvbridge:assembleDebug
      - name: Prepare release assets
        run: |
          cp VistaController/mobile/build/outputs/apk/debug/mobile-debug.apk VistaController-Mobile-v0.2.1.apk
          cp VistaController/tvbridge/build/outputs/apk/debug/tvbridge-debug.apk VistaController-TV-Bridge-v0.2.1.apk
          sha256sum VistaController-*.apk > SHA256SUMS.txt
      - name: Upload compiled APKs
        uses: actions/upload-artifact@v4
        with:
          name: VistaController-v0.2.1-APKs
          path: |
            VistaController-*.apk
            SHA256SUMS.txt
      - name: Publish Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vistacontroller-v0.2.1 \
            VistaController-Mobile-v0.2.1.apk VistaController-TV-Bridge-v0.2.1.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'VistaController v0.2.1 · Responsive Remote beta' --prerelease \
            --notes 'v0.2.1: ecrã do comando redesenhado para telemóveis estreitos. Quatro ações principais por linha, D-pad/OK grandes, volume e canais em cartões separados, reprodução em 3+2 botões, funções secundárias em Mais funções (bottom sheet), teclado e 123 disponíveis, carrossel de apps mantido. Ligações Wi-Fi Remote v2, Bridge e Air Mouse mantidas da v0.2.0. APKs beta debug; interação real com TV não validada.'
