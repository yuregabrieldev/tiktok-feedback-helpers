name: VistaController Android beta release
on:
  push:
    branches:
      - 'vistacontroller-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble verified source archive
        shell: bash
        run: |
          cat VistaController-source.part0{0..5} | base64 --decode > VistaController-src.tar.xz
          tar -xJf VistaController-src.tar.xz
          test -f VistaController/settings.gradle.kts
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile mobile and TV APKs
        working-directory: VistaController
        run: gradle --no-daemon --stacktrace :mobile:assembleDebug :tvbridge:assembleDebug
      - name: Prepare release assets
        run: |
          cp VistaController/mobile/build/outputs/apk/debug/mobile-debug.apk VistaController-Mobile-v0.1.0.apk
          cp VistaController/tvbridge/build/outputs/apk/debug/tvbridge-debug.apk VistaController-TV-Bridge-v0.1.0.apk
          sha256sum VistaController-*.apk > SHA256SUMS.txt
      - name: Upload compiled APKs
        uses: actions/upload-artifact@v4
        with:
          name: VistaController-v0.1.0-APKs
          path: |
            VistaController-*.apk
            SHA256SUMS.txt
      - name: Publish Github Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create vistacontroller-v0.1.0 \
            VistaController-Mobile-v0.1.0.apk VistaController-TV-Bridge-v0.1.0.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'VistaController v0.1.0 · Beta' --prerelease \
            --notes 'Beta nativa Kotlin/Compose: Air Mouse por giroscópio, volume físico como clique, touchpad, Bluetooth HID, comando, ditado para teclado, notificações e módulo TV Bridge para listar e abrir apps. APKs de teste assinados com debug key. Sem transferência de ficheiros ou envio nativo de áudio para apps de terceiros. Requer testes físicos na Hisense.'
