name: Inspect Harvester v2.0 playback and webview
on:
  push:
    branches: [harvester-browser-v20-vistacast]
    paths: [.github/workflows/inspect-harvester-v20.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstitute Harvester with VistaCast
        run: |
          mkdir -p hb-v18 vista
          cat harvester-browser/v1.4.0/payload*.txt | base64 --decode | tar -xJf - -C hb-v18
          base64 -d harvester-browser/v1.5.0/cast-patch.xz.b64 | xz -d > /tmp/cast-v15.py
          (cd hb-v18 && python3 /tmp/cast-v15.py && python3 ../harvester-browser/v1.6.0/fix-cast.py && python3 ../harvester-browser/v1.7.0/now-playing-cast.py && python3 ../harvester-browser/v1.8.0/install-player.py && python3 ../harvester-browser/v1.9.0/upgrade.py)
          base64 -d harvester-browser/v2.0.0/vistacast-base.tar.xz.b64 | xz -d | tar -xf - -C vista
          python3 harvester-browser/v2.0.0/integrate-vistacast.py
      - name: Source landmarks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hb-v18/app/src/main/java/com/harvester/browser/MainActivity.java').read_text().splitlines()
          terms=['onRenderProcessGone','onPageFinished','shouldInterceptRequest','onLoadResource','addJavascriptInterface','JavascriptInterface','onConsoleMessage','onPageStarted','detected.put','detected.values','autoScan','auto-performance','onShowCustomView','onHideCustomView','destroy(','setWebViewClient','newTab(','createTab(','onCreateWindow','onCloseWindow','onTrimMemory','onPause()','onStop()','activeTab','MediaItem(', 'openNativePlayer(','detectMedia(','captureMedia(']
          important=[]
          for i,line in enumerate(s):
            if any(k in line for k in terms): important.append(i)
          indices=set()
          for i in important:
            for j in range(max(0,i-6),min(len(s),i+13)):indices.add(j)
          print('=== SOURCE LANDMARKS ===')
          last=-2
          for j in sorted(indices):
            if j>last+1:print('---')
            print(f'{j+1:05d}: {s[j]}')
            last=j
          print('=== VISTACAST PLAYER ===')
          f=Path('hb-v18/app/src/main/java/com/harvester/browser/NativePlayerActivity.java').read_text().splitlines()
          for i,line in enumerate(f[:430]):print(f'{i+1:05d}: {line}')
          print('=== SERVICE ===')
          f=Path('hb-v18/app/src/main/java/com/harvester/browser/PlaybackService.java').read_text().splitlines()
          for i,line in enumerate(f):print(f'{i+1:05d}: {line}')
          print('=== MANIFEST ===')
          print(Path('hb-v18/app/src/main/AndroidManifest.xml').read_text())
          PY
