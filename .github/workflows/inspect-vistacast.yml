name: Inspect VistaCast source structure
on:
  push:
    branches: [harvester-browser-v20-vistacast]
    paths: [.github/workflows/inspect-vistacast.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode VistaCast base
        run: |
          mkdir vista
          base64 -d harvester-browser/v2.0.0/vistacast-base.tar.xz.b64 | xz -d | tar -xf - -C vista
          find vista -maxdepth 12 -type f -printf '%p %s bytes\n' | sort
      - name: Inspect source interfaces and build dependencies
        run: |
          find vista -type f \( -name '*.java' -o -name '*.kt' -o -name 'AndroidManifest.xml' -o -name 'build.gradle*' \) -print | while read file; do
            echo "################### $file ###################"
            sed -n '1,350p' "$file"
          done
