plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yure.videoharvester'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yure.videoharvester'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
