plugins {
    id 'com.android.application'
}


android {
    namespace 'com.yure.videoharvester'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yure.videoharvester'
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName '3.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}


dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
}
